```yaml
name: Build CoChat Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create CoChat project files
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/cochat/app

          cat > settings.gradle.kts <<'FILE_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CoChat"
          include(":app")
          FILE_END

          cat > build.gradle.kts <<'FILE_END'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          FILE_END

          cat > gradle.properties <<'FILE_END'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          FILE_END

          cat > app/build.gradle.kts <<'FILE_END'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.cochat.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.cochat.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          FILE_END

          cat > app/src/main/AndroidManifest.xml <<'FILE_END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="CoChat"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FILE_END

          cat > app/src/main/java/com/cochat/app/MainActivity.kt <<'FILE_END'
          package com.cochat.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val Background = Color(0xFF17191F)
          private val Panel = Color(0xFF20232B)
          private val Accent = Color(0xFF7289DA)
          private val MainText = Color(0xFFF3F4F6)
          private val Muted = Color(0xFFAAAFBC)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { CoChatApp() }
              }
          }

          @Composable
          fun CoChatApp() {
              var tab by remember { mutableStateOf("Chats") }
              var message by remember { mutableStateOf("") }
              var channel by remember { mutableStateOf("general") }
              var showDialog by remember { mutableStateOf(false) }
              val messages = remember {
                  mutableStateListOf(
                      "CoChat" to "Welcome to CoChat! Your community starts here.",
                      "Alex" to "Hey everyone 👋",
                      "Sam" to "This is our new chat space!"
                  )
              }

              MaterialTheme(colorScheme = darkColorScheme(
                  primary = Accent,
                  background = Background,
                  surface = Panel
              )) {
                  Row(
                      Modifier.fillMaxSize().background(Background)
                  ) {
                      Column(
                          Modifier.width(64.dp).fillMaxHeight().background(Color(0xFF111319))
                              .padding(vertical = 12.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          listOf("C", "🎮", "🎨", "+").forEach { icon ->
                              Box(
                                  Modifier.padding(vertical = 6.dp)
                                      .size(44.dp)
                                      .background(if (icon == "C") Accent else Panel, RoundedCornerShape(16.dp))
                                      .clickable { if (icon == "+") showDialog = true },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(icon, color = MainText, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }

                      Column(Modifier.fillMaxSize()) {
                          Row(
                              Modifier.fillMaxWidth().padding(16.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column {
                                  Text("CoChat", color = MainText, fontSize = 25.sp, fontWeight = FontWeight.Bold)
                                  Text("Your people. Your space.", color = Muted, fontSize = 12.sp)
                              }
                              Text("● Online", color = Color(0xFF58D68D), fontSize = 12.sp)
                          }

                          Row(Modifier.fillMaxWidth().padding(horizontal = 12.dp)) {
                              listOf("Chats", "Discover", "Settings").forEach { item ->
                                  Text(
                                      item,
                                      color = if (tab == item) MainText else Muted,
                                      modifier = Modifier.padding(end = 18.dp, bottom = 12.dp)
                                          .clickable { tab = item },
                                      fontWeight = if (tab == item) FontWeight.Bold else FontWeight.Normal
                                  )
                              }
                          }

                          when (tab) {
                              "Chats" -> {
                                  Text(
                                      "# $channel",
                                      color = MainText,
                                      fontSize = 18.sp,
                                      fontWeight = FontWeight.Bold,
                                      modifier = Modifier.fillMaxWidth().background(Panel).padding(14.dp)
                                  )
                                  LazyColumn(
                                      Modifier.weight(1f).fillMaxWidth().padding(12.dp),
                                      verticalArrangement = Arrangement.spacedBy(12.dp)
                                  ) {
                                      items(messages) { item ->
                                          Column(
                                              Modifier.fillMaxWidth().background(Panel, RoundedCornerShape(12.dp))
                                                  .padding(12.dp)
                                          ) {
                                              Text(item.first, color = Accent, fontWeight = FontWeight.Bold)
                                              Spacer(Modifier.height(4.dp))
                                              Text(item.second, color = MainText)
                                          }
                                      }
                                  }
                                  Row(
                                      Modifier.fillMaxWidth().padding(12.dp)
                                          .background(Panel, RoundedCornerShape(14.dp)).padding(10.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      BasicTextField(
                                          value = message,
                                          onValueChange = { message = it },
                                          modifier = Modifier.weight(1f).padding(8.dp),
                                          textStyle = androidx.compose.ui.text.TextStyle(color = MainText),
                                          decorationBox = { inner ->
                                              if (message.isEmpty()) Text("Message #$channel", color = Muted)
                                              inner()
                                          }
                                      )
                                      Button(onClick = {
                                          if (message.isNotBlank()) {
                                              messages.add("You" to message.trim())
                                              message = ""
                                          }
                                      }) { Text("Send") }
                                  }
                              }

                              "Discover" -> Column(Modifier.padding(16.dp)) {
                                  Text("Discover communities", color = MainText, fontSize = 21.sp)
                                  Spacer(Modifier.height(12.dp))
                                  listOf("Gaming 🎮", "Art & Design 🎨", "Music 🎵", "Friends 💬").forEach {
                                      Text(it, color = MainText, modifier = Modifier.fillMaxWidth()
                                          .padding(vertical = 8.dp).background(Panel, RoundedCornerShape(12.dp))
                                          .clickable { channel = it }.padding(16.dp))
                                  }
                              }

                              else -> Column(Modifier.padding(16.dp)) {
                                  Text("Settings", color = MainText, fontSize = 22.sp)
                                  Spacer(Modifier.height(12.dp))
                                  Text("Profile: CoChat User", color = MainText)
                                  Text("Theme: Dark", color = Muted)
                                  Text("App version: 1.0", color = Muted)
                              }
                          }
                      }
                  }

                  if (showDialog) {
                      var newChannel by remember { mutableStateOf("") }
                      AlertDialog(
                          onDismissRequest = { showDialog = false },
                          title = { Text("Create a channel") },
                          text = {
                              OutlinedTextField(
                                  value = newChannel,
                                  onValueChange = { newChannel = it },
                                  label = { Text("Channel name") }
                              )
                          },
                          confirmButton = {
                              TextButton(onClick = {
                                  if (newChannel.isNotBlank()) channel = newChannel.trim()
                                  showDialog = false
                              }) { Text("Create") }
                          },
                          dismissButton = {
                              TextButton(onClick = { showDialog = false }) { Text("Cancel") }
                          }
                      )
                  }
              }
          }
          FILE_END

      - name: Build Android APK
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoChat-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
```
